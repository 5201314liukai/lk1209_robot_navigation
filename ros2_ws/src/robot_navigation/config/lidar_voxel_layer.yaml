# Local and global costmaps use the same lidar-frame origin for each ray.
plugin: obstacle_detection::VisibilityVoxelLayer
enabled: true
origin_z: -0.05
z_resolution: 0.025
z_voxels: 16
mark_threshold: 0
unknown_threshold: 15
max_obstacle_height: 0.35
publish_voxel_map: false
observation_sources: obstacles clearing_rays
obstacles:
  topic: /lidar/obstacles
  data_type: PointCloud2
  marking: true
  clearing: false
  obstacle_min_range: 0.12
  obstacle_max_range: 7.5
  min_obstacle_height: -0.05
  max_obstacle_height: 0.35
clearing_rays:
  topic: /lidar/clearing
  data_type: PointCloud2
  marking: false
  clearing: true
  raytrace_min_range: 0.12
  raytrace_max_range: 8.0
  # Retain floor and overhead endpoints; the voxel layer clips each ray in 3D.
  min_obstacle_height: -4.0
  max_obstacle_height: 4.0
