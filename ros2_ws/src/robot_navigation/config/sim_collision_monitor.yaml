sim_cmd_vel_guard:
  ros__parameters:
    use_sim_time: true
    directional_stop_enabled: true
    stop_length: 0.42
    stop_half_width: 0.20
    yield_seconds: 4.0
    creep_speed: 0.08
    # 0.203 m encloses the full body and wheels throughout a rotation.
    turn_clear_radius: 0.225
    scan_timeout: 0.4

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /lk1209/sim/cmd_vel_checked
    cmd_vel_out_topic: /lk1209/sim/cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 0.4
    base_shift_correction: true
    stop_pub_timeout: 1.0
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
    polygons: [BodyStop, FootprintApproach, ForwardSlow]
    BodyStop:
      # 0.30 x 0.27 m body and wheels, plus 25 mm on each side.
      type: polygon
      points: [0.175, 0.16, 0.175, -0.16, -0.175, -0.16, -0.175, 0.16]
      action_type: stop
      max_points: 0
      visualize: false
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      # Humble checks the current footprint with >=, so zero would stop on an empty footprint.
      max_points: 1
      visualize: false
    ForwardSlow:
      type: polygon
      points: [0.70, 0.23, 0.70, -0.23, 0.0, -0.23, 0.0, 0.23]
      action_type: slowdown
      slowdown_ratio: 0.35
      max_points: 2
      visualize: false
