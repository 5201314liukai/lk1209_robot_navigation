slam_toolbox:
  ros__parameters:

    use_sim_time: true

    # SLAM 模式
    mode: mapping

    # 坐标系
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    # 雷达
    scan_topic: /scan

    # 地图更新
    resolution: 0.05
    max_laser_range: 8.0

    # 扫描处理
    minimum_time_interval: 0.1
    transform_timeout: 0.2

    # 地图更新频率
    map_update_interval: 2.0

